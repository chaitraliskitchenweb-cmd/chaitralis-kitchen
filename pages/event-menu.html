<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Event Special Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root {
    --olive:    #6b820d; --olive-l:  #8fa812; --olive-bg: #eef2d8;
    --navy:     #1A2B4A; --navy2:    #243856;
    --gold:     #D4A24C; --gold-bg:  #fff8e6;
    --amber:    #c47d0a; --amber-bg: #fff3d6;
    --teal:     #0e7a6e; --teal-bg:  #d6f0ed;
    --maroon:   #8b1a1a;  /* kept for festival accent only */
    --bg:       #f5f5f0; --bg-card:  #ffffff;
    --fg:       #1c1c1a; --fg-soft:  #6b6b63;
    --border:   #e0e0d8;
    --cream:    #fdf6e8; --cream2:   #f9eecc;  /* header gradient keep */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --olive: #96b714; --olive-l: #b8d820; --olive-bg: #1a2604;
      --navy: #1e3060; --navy2: #162448;
      --gold: #e8b84c; --gold-bg: #2a1e04;
      --amber: #e09a22; --amber-bg: #2a1e04;
      --teal: #2abcae; --teal-bg: #082820;
      --bg: #111114; --bg-card: #1c1c20;
      --fg: #f0f0ec; --fg-soft: #9a9a92; --border: #2a2a2e;
      --cream: #1c1c14; --cream2: #1a1a10;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --olive: #96b714; --olive-l: #b8d820; --olive-bg: #1a2604;
    --navy: #1e3060; --navy2: #162448;
    --gold: #e8b84c; --gold-bg: #2a1e04;
    --amber: #e09a22; --amber-bg: #2a1e04;
    --teal: #2abcae; --teal-bg: #082820;
    --bg: #111114; --bg-card: #1c1c20;
    --fg: #f0f0ec; --fg-soft: #9a9a92; --border: #2a2a2e;
    --cream: #1c1c14; --cream2: #1a1a10;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: 'Poppins', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }

  .event-nav { background: var(--navy); padding: 10px 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .event-btn {
    padding: 6px 18px; border-radius: 100px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: rgba(255,255,255,.75);
    font-family: 'Poppins', sans-serif; transition: all .2s;
  }
  .event-btn:hover  { background: rgba(255,255,255,.15); color: #fff; }
  .event-btn.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }

  .event-page { display: none; }
  .event-page.visible { display: block; }

  /* Festive header */
  .fest-header { position: relative; text-align: center; padding: 0 20px 28px; overflow: hidden; }
  .garland { width: 100%; height: 22px; background: repeating-linear-gradient(90deg, #e8640a 0px, #e8640a 18px, #f0a020 18px, #f0a020 26px, #e8640a 26px, #e8640a 36px, #2d5a1b 36px, #2d5a1b 44px); opacity: .85; }
  .garland-dots { background: var(--olive); height: 8px; }
  .fest-header-inner { max-width: 700px; margin: 0 auto; padding-top: 24px; }
  .deity-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
  .deity-svg { width: min(200px, 45vw); filter: drop-shadow(0 4px 20px rgba(180,100,0,.25)); }
  .fest-brand { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .fest-title { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: clamp(2.4rem, 8vw, 3.8rem); color: var(--maroon); line-height: 1.05; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .fest-subtitle { font-family: 'Playfair Display', serif; font-size: clamp(1.1rem, 3.5vw, 1.5rem); color: var(--olive); font-weight: 600; margin-top: 2px; }
  .order-banner { display: inline-block; margin-top: 14px; background: var(--navy); color: #fff; padding: 7px 24px; border-radius: 100px; font-size: 13px; font-weight: 500; }
  .order-banner strong { color: var(--gold); }
  .licensed-badge { display: inline-block; margin-top: 10px; border: 2px solid var(--gold); color: var(--gold); padding: 4px 14px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  /* Menu grid */
  .menu-body { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start; }
  .menu-section { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
  .menu-section.span2 { grid-column: span 2; }
  .menu-section.span3 { grid-column: span 3; }
  .section-head { background: var(--olive); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 7px 14px; text-align: center; }
  .section-head.gold   { background: var(--gold);   color: var(--navy); }
  .section-head.maroon { background: var(--maroon); color: #fff; }
  .section-body { padding: 10px 12px; }
  .dish-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .dish-row:last-child { border-bottom: none; }
  .dish-img { width: 44px; height: 44px; border-radius: 6px; flex-shrink: 0; background: var(--cream2); display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; }
  .dish-details { flex: 1; min-width: 0; }
  .dish-dname { font-weight: 600; font-size: 12.5px; color: var(--navy); line-height: 1.2; }
  .dish-sub   { font-size: 10.5px; color: var(--fg-soft); margin-top: 1px; }
  .dish-price { text-align: right; flex-shrink: 0; min-width: 60px; }
  .dish-price .price-line { font-size: 11px; color: var(--fg-soft); line-height: 1.6; white-space: nowrap; }
  .dish-price .price-line strong { font-weight: 700; color: var(--fg); margin-left: 4px; }

  /* Sweets grid */
  .sweets-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
  .sweet-card { text-align: center; padding: 10px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .sweet-icon  { font-size: 28px; margin-bottom: 6px; }
  .sweet-name  { font-weight: 600; font-size: 12px; color: var(--navy); line-height: 1.3; }
  .sweet-price { font-size: 12px; font-weight: 700; color: var(--olive); margin-top: 4px; }

  /* Footer */
  .menu-footer { max-width: 960px; margin: 0 auto; padding: 0 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .footer-card { background: var(--navy2); color: #fff; border-radius: 10px; padding: 14px 18px; text-align: center; }
  .footer-card .fc-label { font-size: 10px; opacity: .6; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .footer-card .fc-val   { font-size: 15px; font-weight: 700; }
  .footer-card.contact   { background: var(--olive); }
  .footer-card.contact .fc-val { font-size: 20px; letter-spacing: .04em; }
  .pickup-strip { background: var(--navy); color: #fff; max-width: 960px; margin: 0 auto; border-radius: 0 0 10px 10px; display: flex; font-size: 12.5px; font-weight: 600; overflow: hidden; }
  .strip-half { flex: 1; padding: 10px 16px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .strip-half + .strip-half { border-left: 1px solid rgba(255,255,255,.2); }

  /* Coming soon / custom */
  .coming-soon { text-align: center; padding: 60px 20px; color: var(--fg-soft); }
  .coming-soon p:first-child { font-size: 16px; font-weight: 600; }
  .coming-soon p { margin-top: 8px; font-size: 13px; }
  .custom-body { text-align: center; padding: 48px 20px; max-width: 560px; margin: 0 auto; }
  .custom-body .cust-title { font-size: 16px; font-weight: 600; color: var(--navy); }
  .custom-body .cust-desc  { margin-top: 10px; font-size: 13px; color: var(--fg-soft); line-height: 1.7; }
  .contact-chip { display: inline-block; margin-top: 24px; background: var(--maroon); color: #fff; padding: 16px 24px; border-radius: 12px; }
  .contact-chip .lbl { font-size: 11px; opacity: .7; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .contact-chip .num { font-size: 22px; font-weight: 700; letter-spacing: .04em; }

  .loading { text-align: center; padding: 60px 20px; color: var(--fg-soft); font-size: 14px; }
  .error-msg { text-align: center; padding: 40px 20px; color: #c0392b; font-size: 13px; }

  @media (max-width: 620px) {
    .menu-body { grid-template-columns: 1fr; }
    .menu-section.span2, .menu-section.span3 { grid-column: span 1; }
    .sweets-grid { grid-template-columns: 1fr 1fr; }
    .menu-footer { grid-template-columns: 1fr; }
  }

  /* ── Shared Site Nav ── */
  .ck-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 0 5%;
    height: 58px;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(107,130,13,0.18);
    font-family: 'Poppins', sans-serif;
  }
  .ck-brand {
    display: flex; align-items: center; gap: 9px;
    text-decoration: none; flex-shrink: 0;
  }
  .ck-brand img {
    width: 34px; height: 34px; border-radius: 50%; object-fit: contain;
    background: #f2f5e6;
  }
  .ck-brand span {
    font-family: 'Playfair Display', serif; font-size: 1rem;
    font-weight: 700; color: #1A2B4A;
  }
  .ck-brand em { color: #6b820d; font-style: italic; }
  .ck-links {
    display: flex; list-style: none; gap: 24px;
    margin: 0 auto; padding: 0;
  }
  .ck-links a {
    text-decoration: none; font-size: 13px; font-weight: 500;
    color: #1A2B4A; letter-spacing: .01em; transition: color .15s;
  }
  .ck-links a:hover { color: #6b820d; }
  .ck-links a.active { color: #6b820d; font-weight: 600; }
  .ck-order {
    flex-shrink: 0; text-decoration: none;
    background: #6b820d; color: #fff;
    padding: 7px 18px; border-radius: 24px;
    font-size: 12.5px; font-weight: 600; transition: opacity .15s;
  }
  .ck-order:hover { opacity: .87; }
  .ck-burger {
    display: none; background: none; border: none;
    font-size: 22px; cursor: pointer; color: #1A2B4A;
    padding: 4px;
  }
  @media (max-width: 600px) {
    .ck-links { display: none; position: absolute; top: 58px; left: 0; right: 0;
      flex-direction: column; background: #fff; border-bottom: 1px solid rgba(107,130,13,0.18);
      padding: 12px 5% 16px; gap: 12px; z-index: 201; }
    .ck-nav.open .ck-links { display: flex; }
    .ck-burger { display: block; }
  }
  /* push page content below fixed nav */
  body { padding-top: 58px; }


  /* ── Order Countdown Badge ── */
  .ck-countdown {
    display: flex; align-items: center; gap: 6px;
    background: #fff8e6; border: 1.5px solid #D4A24C;
    border-radius: 20px; padding: 4px 12px;
    font-size: 11.5px; font-weight: 600; color: #8a5a00;
    white-space: nowrap; flex-shrink: 0;
    transition: background .3s;
  }
  .ck-countdown .cd-dot { font-size: 13px; }
  .ck-countdown .cd-label { opacity: .75; font-weight: 500; }
  .ck-countdown .cd-time { color: #6b820d; font-variant-numeric: tabular-nums; }
  .ck-countdown.cd-urgent { background: #fff0f0; border-color: #e05a5a; color: #a00; }
  .ck-countdown.cd-urgent .cd-time { color: #c0392b; }
  @media (max-width: 480px) {
    .ck-countdown .cd-label { display: none; }
  }


  /* ── Event Hero Images ── */
  .hero-img-wrap {
    display: flex; justify-content: center; margin: 20px 0 14px;
  }
  .hero-img {
    width: min(180px, 42vw);
    height: min(180px, 42vw);
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid rgba(255,255,255,0.7);
    box-shadow: 0 6px 32px rgba(0,0,0,0.18), 0 0 0 2px var(--gold);
    display: block;
  }

</style>
</head>
<body>
<nav class="ck-nav" id="ck-nav">
  <a class="ck-brand" href="../index.html">
    <img src="../Logo/logo.png" alt="logo" onerror="this.style.display='none'">
    <span>Chaitrali's <em>Kitchen</em></span>
  </a>
  <ul class="ck-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="weekly-menu.html">Tiffin Menu</a></li>
    <li><a href="event-menu.html">Events</a></li>
    <li><a href="order.html">Order</a></li>
  </ul>
  <div class="ck-countdown" id="ck-countdown"><span class="cd-dot">🕐</span><span class="cd-label">Tiffin order ·</span><span class="cd-time" id="cd-time">…</span></div>
  <a class="ck-order" href="order.html">Order Now</a>
  <button class="ck-burger" onclick="document.getElementById('ck-nav').classList.toggle('open')" aria-label="Menu">☰</button>
</nav>


<div id="event-nav" class="event-nav"></div>

<div id="events-root">
  <div class="loading">Loading menus…</div>
</div>

<script>
(function() {
  const DATA_PATH = '../data/menu.json';

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Ganpati SVG (static decoration) ──
  const GANESHA_SVG = `<svg class="deity-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="228" rx="62" ry="14" fill="#e8b4c0" opacity=".5"/>
    <g opacity=".85">
      <ellipse cx="100" cy="218" rx="18" ry="10" fill="#f48fb1" transform="rotate(-30 100 218)"/>
      <ellipse cx="100" cy="218" rx="18" ry="10" fill="#f48fb1" transform="rotate(30 100 218)"/>
      <ellipse cx="100" cy="218" rx="18" ry="10" fill="#ec407a"/>
      <ellipse cx="72" cy="212" rx="15" ry="9" fill="#f48fb1"/>
      <ellipse cx="128" cy="212" rx="15" ry="9" fill="#f48fb1"/>
    </g>
    <ellipse cx="100" cy="185" rx="52" ry="48" fill="#f9a825"/>
    <ellipse cx="100" cy="190" rx="48" ry="40" fill="#fb8c00" opacity=".3"/>
    <ellipse cx="100" cy="192" rx="26" ry="22" fill="#e65100" opacity=".18"/>
    <circle cx="100" cy="198" r="4" fill="#bf360c" opacity=".4"/>
    <ellipse cx="52" cy="170" rx="18" ry="10" fill="#f9a825" transform="rotate(-30 52 170)"/>
    <ellipse cx="148" cy="170" rx="18" ry="10" fill="#f9a825" transform="rotate(30 148 170)"/>
    <circle cx="38" cy="162" r="10" fill="#f9a825"/>
    <circle cx="162" cy="162" r="10" fill="#f9a825"/>
    <ellipse cx="30" cy="152" rx="10" ry="12" fill="#fff9c4"/>
    <path d="M24 152 Q30 142 36 152" stroke="#f9a825" stroke-width="1.5" fill="none"/>
    <line x1="156" y1="156" x2="168" y2="156" stroke="#e65100" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="155" y1="160" x2="169" y2="160" stroke="#e65100" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="156" y1="164" x2="168" y2="164" stroke="#e65100" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="84" y="124" width="32" height="22" rx="8" fill="#f9a825"/>
    <path d="M84 136 Q100 146 116 136" stroke="#b8860b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="145" r="5" fill="#b8860b"/>
    <ellipse cx="100" cy="102" rx="50" ry="52" fill="#f9a825"/>
    <ellipse cx="50" cy="100" rx="20" ry="26" fill="#f9a825"/>
    <ellipse cx="50" cy="100" rx="13" ry="17" fill="#fb8c00" opacity=".4"/>
    <ellipse cx="150" cy="100" rx="20" ry="26" fill="#f9a825"/>
    <ellipse cx="150" cy="100" rx="13" ry="17" fill="#fb8c00" opacity=".4"/>
    <path d="M86 122 Q72 140 80 156 Q84 162 90 158 Q96 154 92 140 Q100 148 106 142 Q112 136 100 122" fill="#f9a825" stroke="#e65100" stroke-width="1" opacity=".8"/>
    <ellipse cx="84" cy="96" rx="10" ry="10" fill="white"/>
    <ellipse cx="116" cy="96" rx="10" ry="10" fill="white"/>
    <circle cx="85" cy="96" r="6" fill="#1a0a00"/>
    <circle cx="117" cy="96" r="6" fill="#1a0a00"/>
    <circle cx="83" cy="94" r="2" fill="white"/>
    <circle cx="115" cy="94" r="2" fill="white"/>
    <path d="M76 87 Q84 83 92 87" stroke="#5d2c0a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M108 87 Q116 83 124 87" stroke="#5d2c0a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="82" rx="6" ry="4" fill="#b71c1c" opacity=".8"/>
    <circle cx="100" cy="82" r="2" fill="#ffcc02"/>
    <path d="M60 76 Q62 50 100 46 Q138 50 140 76" fill="#b8860b"/>
    <path d="M68 72 Q70 54 100 50 Q130 54 132 72" fill="#d4a017"/>
    <circle cx="100" cy="52" r="6" fill="#e53935"/>
    <circle cx="82" cy="58" r="4" fill="#43a047"/>
    <circle cx="118" cy="58" r="4" fill="#1e88e5"/>
    <path d="M94 46 Q100 38 106 46" fill="#b8860b"/>
    <circle cx="100" cy="37" r="4" fill="#ffcc02"/>
    <text x="100" y="70" text-anchor="middle" font-size="13" fill="#8b1a1a" font-family="serif" opacity=".7">ॐ</text>
  </svg>`;

  function buildDishRow(dish) {
    const prices = (dish.prices||[]).map(p => {
      const lbl = p.label ? `${esc(p.label)} ` : '';
      return `<div class="price-line">${lbl}<strong>${esc(p.amount)}</strong></div>`;
    }).join('');
    return `<div class="dish-row">
      <div class="dish-img">${esc(dish.icon||'🍽')}</div>
      <div class="dish-details">
        <div class="dish-dname">${esc(dish.name)}</div>
        ${dish.desc ? `<div class="dish-sub">${esc(dish.desc)}</div>` : ''}
      </div>
      <div class="dish-price">${prices}</div>
    </div>`;
  }

  function buildSection(sec) {
    const styleClass = (sec.style === 'gold' || sec.style === 'maroon') ? ` ${sec.style}` : '';
    const isSweetsGrid = sec.name && sec.name.includes('Ganesh') && sec.dishes && sec.dishes.every(d => !d.prices || !d.prices.length || (d.prices.length === 1 && d.prices[0].label && d.prices[0].label.match(/^\(\d+\)$/)));

    let body;
    if (isSweetsGrid) {
      const cards = (sec.dishes||[]).map(d => {
        const priceStr = d.prices && d.prices[0] ? `${d.prices[0].label||''} for ${d.prices[0].amount||''}` : '';
        return `<div class="sweet-card">
          <div class="sweet-icon">${esc(d.icon||'🍡')}</div>
          <div class="sweet-name">${esc(d.name)}</div>
          <div class="sweet-price">${esc(priceStr)}</div>
        </div>`;
      }).join('');
      body = `<div class="sweets-grid">${cards}</div>`;
    } else {
      body = `<div class="section-body">${(sec.dishes||[]).map(buildDishRow).join('')}</div>`;
    }
    return `<div class="menu-section">
      <div class="section-head${styleClass}">${esc(sec.name)}</div>
      ${body}
    </div>`;
  }

  function buildEventPage(key, ev, s, isFirst) {
    const emojis = { ganpati:'🐘', diwali:'🪔', holi:'🌸', custom:'🎉' };
    const emoji = emojis[key] || '🎊';
    const heroImgs = {
      ganpati: '../images/events/ganpati/Hero-Ganapati.jpeg',
      diwali:  '../images/events/diwali/Hero-Diwali.jpeg',
      holi:    '../images/events/holi/Hero-Holi.jpg',
      custom:  '../images/events/custom/Hero-Custom.jpeg'
    };
    const heroImg = heroImgs[key] || '';

    if (key === 'custom') {
      return `<div class="event-page${isFirst?' visible':''}" id="page-${key}">
        <div class="fest-header" style="background:linear-gradient(180deg,#f3f4f6 0%,#e8eecc 100%);">
          <div class="garland" style="background:repeating-linear-gradient(90deg,#6b820d 0,#6b820d 18px,#b8860b 18px,#b8860b 26px,#6b820d 26px,#6b820d 36px,#8b1a1a 36px,#8b1a1a 44px);"></div>
          <div class="garland-dots" style="background:#6b820d;"></div>
          <div class="fest-header-inner">
            <div class="hero-img-wrap"><img class="hero-img" src="${heroImg}" alt="${esc(ev.title)}" onerror="this.parentElement.innerHTML='<span style=font-size:80px>🎉</span>'"></div>
            <p class="fest-brand">Chaitrali's Kitchen LLC · Homemade with Love</p>
            <div class="fest-title" style="font-size:2.4rem;">${esc(ev.title)}</div>
            <div class="fest-subtitle">${esc(ev.subtitle)}</div>
            <div class="order-banner">Call to plan your <strong>custom menu</strong></div>
          </div>
        </div>
        <div class="custom-body">
          <p class="cust-title">Plan Your Dream Event Menu</p>
          <p class="cust-desc">We cater birthdays, anniversaries, pujas, baby showers, and all celebrations with authentic Maharashtrian home cooking. Menu customized to your event and guest count.</p>
          <div class="contact-chip">
            <div class="lbl">📞 Call or WhatsApp</div>
            <div class="num">${esc(s.phone||'617-320-5229')}</div>
          </div>
        </div>
      </div>`;
    }

    // Coming soon events (no sections)
    if (!ev.active || !ev.sections || ev.sections.length === 0) {
      const themes = {
        diwali: { bg:'linear-gradient(180deg,#1a0a2e 0%,#2d0a4e 50%,#fdf6e8 100%)', garland:'repeating-linear-gradient(90deg,#ff9800 0,#ff9800 18px,#ffc107 18px,#ffc107 26px,#ff5722 26px,#ff5722 36px,#9c27b0 36px,#9c27b0 44px)', dotBg:'#4a0080', titleColor:'#ffc107', subColor:'#f9a825', bannerBg:'#4a0080', brandColor:'#ffc107' },
        holi:   { bg:'linear-gradient(180deg,#fff8e1 0%,#f3e5f5 50%,#e8f5e9 100%)', garland:'repeating-linear-gradient(90deg,#e91e63 0,#e91e63 18px,#9c27b0 18px,#9c27b0 26px,#2196f3 26px,#2196f3 36px,#4caf50 36px,#4caf50 44px)', dotBg:'#9c27b0', titleColor:'#9c27b0', subColor:'#e91e63', bannerBg:'#9c27b0', brandColor:'#9c27b0' }
      };
      const th = themes[key] || themes.diwali;
      return `<div class="event-page${isFirst?' visible':''}" id="page-${key}">
        <div class="fest-header" style="background:${th.bg};">
          <div class="garland" style="background:${th.garland};"></div>
          <div class="garland-dots" style="background:${th.dotBg};"></div>
          <div class="fest-header-inner">
            <div class="hero-img-wrap"><img class="hero-img" src="${heroImg}" alt="${esc(ev.title)}" style="border-color:${th.titleColor}" onerror="this.parentElement.innerHTML='<span style=font-size:80px>${emoji}</span>'"></div>
            <p class="fest-brand" style="color:${th.brandColor};">Chaitrali's Kitchen LLC · Homemade with Love</p>
            <div class="fest-title" style="color:${th.titleColor};">${esc(ev.title)}</div>
            <div class="fest-subtitle" style="color:${th.subColor};">${esc(ev.subtitle)}</div>
            <div class="order-banner" style="background:${th.bannerBg};">Menu <strong>Coming Soon</strong></div>
          </div>
        </div>
        <div class="coming-soon">
          <p>${emoji} ${esc(ev.title)} Special Menu</p>
          <p>Menu will be announced closer to the festival.<br>Contact us at <strong>${esc(s.phone||'617-320-5229')}</strong> to pre-book.</p>
        </div>
      </div>`;
    }

    // Full event with sections (Ganpati style)
    const sections = ev.sections || [];
    // Build the 3-column grid: first 2 sections in col 1+2, last section in col 3 stacked with dal/bread/rice
    // Use a flexible approach: render sections individually, let CSS handle layout
    const sectionHtml = sections.map((sec, i) => {
      // Sweet section gets span2, Ganesh Sweets gets its own cell
      const isSweet = sec.name && sec.name.toLowerCase().includes('sweet') && !sec.name.includes('Ganesh');
      const html = buildSection(sec);
      if (isSweet) {
        return html.replace('<div class="menu-section">', '<div class="menu-section span2">');
      }
      return html;
    }).join('');

    const orderBanner = ev.order_by
      ? `<div class="order-banner">Book your order by <strong>${esc(ev.order_by)}</strong></div>`
      : '';

    return `<div class="event-page${isFirst?' visible':''}" id="page-${key}">
      <div class="fest-header" style="background:linear-gradient(180deg,#fdf0d0 0%,#fde8b0 60%,#fdf6e8 100%);">
        <div class="garland"></div>
        <div class="garland-dots"></div>
        <div class="fest-header-inner">
          <div class="hero-img-wrap"><img class="hero-img" src="${heroImg}" alt="${esc(ev.title)}" onerror="this.style.display='none'"></div>
          <p class="fest-brand">Chaitrali's Kitchen LLC · Homemade with Love</p>
          <div class="fest-title">${esc(ev.title)}</div>
          <div class="fest-subtitle">${esc(ev.subtitle)}</div>
          ${orderBanner}
          <br>
          <span class="licensed-badge">✓ Licensed Food Vendor</span>
        </div>
      </div>
      <div class="menu-body">${sectionHtml}</div>
      <div class="menu-footer">
        <div class="footer-card contact">
          <div class="fc-label">📞 Contact to Order</div>
          <div class="fc-val">${esc(s.phone||'617-320-5229')}</div>
        </div>
        <div class="footer-card">
          <div class="fc-label">Location</div>
          <div class="fc-val">${esc(s.location||'Shrewsbury, MA')}</div>
        </div>
      </div>
      <div class="pickup-strip" style="max-width:960px;margin:8px auto 16px;border-radius:10px;">
        <div class="strip-half">📍 Pick Up · Shrewsbury</div>
        <div class="strip-half">🚚 Delivery Available with Fee</div>
      </div>
    </div>`;
  }

  function render(menu) {
    const s = menu.settings || {};
    const events = menu.events || {};
    const evKeys = Object.keys(events);
    const emojis = { ganpati:'🐘', diwali:'🪔', holi:'🌸', custom:'🎉' };

    // Build nav
    const navHtml = evKeys.map((k, i) => {
      const ev = events[k];
      const emoji = emojis[k] || '🎊';
      return `<button class="event-btn${i===0?' active':''}" data-event="${k}">${emoji} ${esc(ev.title)}</button>`;
    }).join('');
    document.getElementById('event-nav').innerHTML = navHtml;

    // Build event pages (first active is shown)
    const pagesHtml = evKeys.map((k, i) => buildEventPage(k, events[k], s, i===0)).join('');
    document.getElementById('events-root').innerHTML = pagesHtml;

    // Tab switching
    const btnEls  = document.querySelectorAll('.event-btn');
    const pageEls = document.querySelectorAll('.event-page');
    btnEls.forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = btn.dataset.event;
        btnEls.forEach(b => b.classList.remove('active'));
        pageEls.forEach(p => p.classList.remove('visible'));
        btn.classList.add('active');
        const pg = document.getElementById('page-' + ev);
        if (pg) pg.classList.add('visible');
        window.scrollTo({top: 0, behavior: 'smooth'});
      });
    });
  }

  fetch('../data/menu.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(err => {
      document.getElementById('events-root').innerHTML =
        `<div class="error-msg">⚠️ Unable to load menu data (${err.message}). Please try again later.</div>`;
    });
})();
</script>

<script>
(function(){
  function nextCutoff() {
    // Sunday 9 PM Eastern — compute next occurrence
    const now = new Date();
    // Work in the visitor's local time but cutoff is "Sunday 9 PM ET"
    // We'll compute UTC offset for Eastern: EST = UTC-5, EDT = UTC-4
    // Simple approach: find next Sunday then set to 21:00 ET
    const ET_OFFSET_HOURS = (() => {
      // Detect whether ET is currently EDT or EST using Intl
      try {
        const fmt = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', hour:'numeric', hour12:false});
        const localH = parseInt(fmt.format(now));
        const utcH = now.getUTCHours();
        const diff = utcH - localH;
        return diff < 0 ? diff + 24 : diff;  // offset hours ET is behind UTC
      } catch(e) { return 4; }  // fallback to EDT
    })();
    // Find next Sunday 9 PM ET as a UTC Date
    const d = new Date(now);
    const dayOfWeek = d.getUTCDay(); // 0=Sun
    const daysUntilSun = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
    d.setUTCDate(d.getUTCDate() + daysUntilSun);
    d.setUTCHours(21 + ET_OFFSET_HOURS, 0, 0, 0);
    // If that's already past, add 7 days
    if (d <= now) d.setUTCDate(d.getUTCDate() + 7);
    return d;
  }

  function fmt2(n) { return String(n).padStart(2,'0'); }

  function tick() {
    const el = document.getElementById('cd-time');
    const badge = document.getElementById('ck-countdown');
    if (!el || !badge) return;
    const now = new Date();
    const cutoff = nextCutoff();
    const diff = cutoff - now;
    if (diff <= 0) { el.textContent = 'Opens next Sun!'; badge.classList.remove('cd-urgent'); return; }
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    const secs  = Math.floor((diff % 60000)    / 1000);
    const urgent = diff < 3600000 * 6; // last 6 hours = red
    badge.classList.toggle('cd-urgent', urgent);
    if (days > 0) {
      el.textContent = days + 'd ' + fmt2(hours) + 'h ' + fmt2(mins) + 'm';
    } else {
      el.textContent = fmt2(hours) + 'h ' + fmt2(mins) + 'm ' + fmt2(secs) + 's';
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
