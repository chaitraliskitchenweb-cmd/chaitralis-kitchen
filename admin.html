<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Chaitrali's Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,600&display=swap">
<style>
:root{--olive:#6b820d;--olive-dk:#556810;--navy:#1A2B4A;--gold:#D4A24C;
  --bg:#f5f5f0;--fg:#1a1a1a;--muted:#666;--card:#fff;--border:#ddd;
  --danger:#c0392b;--success:#2e7d32;--chip-bg:#f0f4e8;--chip-border:#c5d07a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--fg:#e8e8e0;--muted:#aaa;--card:#1c1c1e;--border:#333;
  --chip-bg:#1e2a0a;--chip-border:#4a6008;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--fg:#e8e8e0;--muted:#aaa;--card:#1c1c1e;
  --border:#333;--chip-bg:#1e2a0a;--chip-border:#4a6008;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding-bottom:72px}
.ck-nav{background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 1.2rem;height:56px;position:sticky;top:0;z-index:100}
.ck-nav .brand{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;color:#fff;font-style:italic}
.ck-nav .badge{background:var(--gold);color:#1a1a1a;font-size:.68rem;font-weight:600;
  padding:.15rem .5rem;border-radius:20px;letter-spacing:.05em}
.btn{display:inline-flex;align-items:center;gap:.35rem;font-family:'Poppins',sans-serif;
  font-size:.82rem;font-weight:600;border:none;border-radius:8px;cursor:pointer;
  padding:.42rem .9rem;transition:.15s}
.btn-primary{background:var(--olive);color:#fff}
.btn-primary:hover{background:var(--olive-dk)}
.btn-outline{background:transparent;color:var(--fg);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--olive);color:var(--olive)}
.btn-sm{font-size:.75rem;padding:.3rem .65rem}
.btn-ghost{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.82rem;padding:.2rem .4rem}
.btn-ghost:hover{color:var(--danger)}
.page{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
.page-title{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;color:var(--navy);margin-bottom:.25rem}
.page-sub{color:var(--muted);font-size:.83rem;margin-bottom:1.6rem}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--border);margin-bottom:1.6rem;overflow-x:auto}
.tab{font-size:.84rem;font-weight:600;padding:.55rem 1rem;border:none;background:none;
  color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;
  white-space:nowrap;font-family:'Poppins',sans-serif;transition:.15s}
.tab.active{color:var(--olive);border-bottom-color:var(--olive)}
.section{margin-bottom:1.6rem}
.section-head{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--olive);margin-bottom:.75rem;padding-bottom:.3rem;border-bottom:1px solid var(--chip-border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:.8rem}
.field{margin-bottom:.7rem}
.field label{display:block;font-size:.73rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:.28rem}
.field input,.field textarea,.field select{width:100%;font-family:'Poppins',sans-serif;font-size:.88rem;
  color:var(--fg);background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  padding:.45rem .7rem;transition:.15s;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--olive)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.75rem}
@media(max-width:600px){.row2,.row3{grid-template-columns:1fr}}
.dish-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:.6rem}
.dish-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.dish-name-label{font-weight:600;font-size:.88rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish-fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:500px){.dish-fields{grid-template-columns:1fr}}
.tag-select{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem}
.tag-opt{font-size:.72rem;font-weight:600;padding:.18rem .5rem;border-radius:20px;
  border:1.5px solid var(--border);cursor:pointer;background:var(--card);color:var(--muted);transition:.12s}
.tag-opt.sel{background:var(--chip-bg);border-color:var(--chip-border);color:var(--olive-dk)}
.price-row{display:flex;gap:.45rem;align-items:center;margin-bottom:.4rem}
.price-row input{flex:1;font-family:'Poppins',sans-serif;font-size:.83rem;color:var(--fg);
  background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:.38rem .6rem;outline:none}
.price-row input:focus{border-color:var(--olive)}
.price-lbl{font-size:.7rem;color:var(--muted);white-space:nowrap}
.ev-sec-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;margin-bottom:.8rem}
.ev-sec-head{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1rem;background:var(--chip-bg);border-radius:12px 12px 0 0;border-bottom:1px solid var(--chip-border)}
.ev-sec-body{padding:.8rem 1rem}
.add-btn{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;
  color:var(--olive);background:var(--chip-bg);border:1.5px dashed var(--chip-border);
  border-radius:8px;padding:.4rem .9rem;cursor:pointer;transition:.15s;width:100%;justify-content:center}
.add-btn:hover{background:#deeaa0}
.toggle-row{display:flex;align-items:center;gap:.55rem}
.toggle{position:relative;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--border);
  border-radius:22px;cursor:pointer;transition:.2s}
.slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--olive)}
.toggle input:checked+.slider:before{transform:translateX(16px)}
.status-bar{position:fixed;bottom:0;left:0;right:0;padding:.65rem 1.2rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  background:var(--card);border-top:1px solid var(--border);z-index:200}
.status-msg{font-size:.8rem;color:var(--muted)}
.status-msg.ok{color:var(--success)}
.status-msg.err{color:var(--danger)}
.toast{position:fixed;bottom:68px;right:1.2rem;background:var(--navy);color:#fff;
  border-radius:10px;padding:.55rem 1rem;font-size:.82rem;font-weight:500;
  box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:300;transform:translateY(16px);
  opacity:0;transition:.22s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.inline-input{width:100%;font-family:'Poppins',sans-serif;font-size:.85rem;color:var(--fg);
  background:var(--bg);border:1.5px solid var(--border);border-radius:7px;
  padding:.38rem .6rem;outline:none;transition:.15s}
.inline-input:focus{border-color:var(--olive)}
</style>
</head>
<body>
<nav class="ck-nav">
  <div style="display:flex;align-items:center;gap:.7rem">
    <span class="brand">Chaitrali's Kitchen</span>
    <span class="badge">Admin</span>
  </div>
  <div style="display:flex;gap:.5rem">
    <button class="btn btn-outline btn-sm" onclick="loadFromFile()">📂 Load JSON</button>
    <button class="btn btn-primary btn-sm" onclick="downloadJSON()">⬇ Save menu.json</button>
  </div>
</nav>

<div class="page">
  <div class="page-title">Menu Manager</div>
  <p class="page-sub">Edit tiffin weeks, event dishes &amp; settings · when done click <strong>Save menu.json</strong>, then replace <code>data/menu.json</code> in your repo and push.</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tiffin',this)">🍱 Weekly Tiffin</button>
    <button class="tab" onclick="switchTab('events',this)">🎉 Events</button>
    <button class="tab" onclick="switchTab('settings',this)">⚙️ Settings</button>
  </div>

  <div id="tab-tiffin"></div>
  <div id="tab-events" style="display:none"></div>
  <div id="tab-settings" style="display:none"></div>
</div>

<div class="status-bar">
  <span class="status-msg" id="status-msg">Ready · click Load JSON to open your menu.json</span>
  <div style="display:flex;gap:.5rem">
    <button class="btn btn-outline btn-sm" onclick="loadFromFile()">📂 Load JSON</button>
    <button class="btn btn-primary btn-sm" onclick="downloadJSON()">⬇ Save menu.json</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileChosen(event)">

<script>
var data=null;
var TAGS=[{k:'spicy',l:'Spicy · Gravy'},{k:'rassa',l:'Rassa'},{k:'usal',l:'Usal'},
  {k:'dry',l:'Dry Sabzi'},{k:'dal',l:'Dal'},{k:'rice',l:'Rice'},
  {k:'snack',l:'Snack'},{k:'special',l:'Festival Special'},{k:'chutney',l:'Chutney'}];
var WEEK_ORDER=['this_week','next_week','last_week'];
var WEEK_LABELS={last_week:'Last Week',this_week:'This Week ✦',next_week:'Next Week'};
var EVENT_KEYS=['ganpati','diwali','holi','custom'];
var SECTION_STYLES=['green','maroon','gold','blue'];

// Auto-load
(async function boot(){
  for(var p of['data/menu.json','../data/menu.json']){
    try{var r=await fetch(p);if(r.ok){data=await r.json();render();setStatus('Auto-loaded · '+p,'ok');return;}}catch(e){}
  }
  setStatus('Click Load JSON to open your data/menu.json','');
})();

// TAB SWITCH
function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  btn.classList.add('active');
  ['tiffin','events','settings'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=t===name?'':'none';
  });
}

function render(){if(!data)return;renderTiffin();renderEvents();renderSettings();}

// ── TIFFIN ──────────────────────────────────────────────────────────
function renderTiffin(){
  var el=document.getElementById('tab-tiffin');el.innerHTML='';
  WEEK_ORDER.forEach(function(wk){
    var week=data.tiffin&&data.tiffin[wk]?data.tiffin[wk]:{dates:'',dishes:[]};
    el.appendChild(buildWeekBlock(wk,week));
  });
}

function buildWeekBlock(wk,week){
  var wrap=document.createElement('div');wrap.className='section';
  var hd=document.createElement('div');hd.className='section-head';hd.textContent=WEEK_LABELS[wk]||wk;
  wrap.appendChild(hd);
  var card=document.createElement('div');card.className='card';
  var datesDiv=document.createElement('div');datesDiv.className='field';
  datesDiv.innerHTML='<label>Date Range</label><input type="text" placeholder="e.g. Oct 7 – Oct 12, 2026" class="inline-input" value="'+esc(week.dates||'')+'">';
  datesDiv.querySelector('input').addEventListener('input',function(){setPath('tiffin.'+wk+'.dates',this.value);});
  card.appendChild(datesDiv);
  var dhd=document.createElement('div');dhd.className='section-head';dhd.style.marginTop='.3rem';dhd.textContent='Dishes';
  card.appendChild(dhd);
  var dbox=document.createElement('div');dbox.id='dishes-'+wk;
  (week.dishes||[]).forEach(function(d,i){dbox.appendChild(buildDishRow(wk,i,d));});
  card.appendChild(dbox);
  var ab=document.createElement('button');ab.className='add-btn';ab.textContent='+ Add Dish';
  ab.onclick=function(){
    if(!data.tiffin)data.tiffin={};
    if(!data.tiffin[wk])data.tiffin[wk]={dates:'',dishes:[]};
    var i=data.tiffin[wk].dishes.length;
    data.tiffin[wk].dishes.push({name:'',desc:'',tag:'dry',tag_label:'Dry Sabzi'});
    dbox.insertBefore(buildDishRow(wk,i,data.tiffin[wk].dishes[i]),ab);
    markDirty();
  };
  card.appendChild(ab);
  wrap.appendChild(card);
  return wrap;
}

function buildDishRow(wk,idx,dish){
  var div=document.createElement('div');div.className='dish-card';
  var head=document.createElement('div');head.className='dish-head';
  var nm=document.createElement('span');nm.className='dish-name-label';nm.textContent=dish.name||'New dish';
  var rm=document.createElement('button');rm.className='btn btn-ghost btn-sm';rm.textContent='✕';
  rm.onclick=function(){data.tiffin[wk].dishes.splice(idx,1);renderTiffin();markDirty();};
  head.appendChild(nm);head.appendChild(rm);
  div.appendChild(head);
  var df=document.createElement('div');df.className='dish-fields';
  df.appendChild(field('Dish Name',dish.name||'',function(v){dish.name=v;nm.textContent=v||'New dish';markDirty();}));
  df.appendChild(field('Description',dish.desc||'',function(v){dish.desc=v;markDirty();}));
  div.appendChild(df);
  var tf=document.createElement('div');tf.className='field';
  var tl=document.createElement('label');tl.textContent='Tag';tf.appendChild(tl);
  var ts=document.createElement('div');ts.className='tag-select';
  TAGS.forEach(function(t){
    var s=document.createElement('span');s.className='tag-opt'+(dish.tag===t.k?' sel':'');
    s.textContent=t.l;
    s.onclick=function(){ts.querySelectorAll('.tag-opt').forEach(function(x){x.classList.remove('sel')});
      s.classList.add('sel');dish.tag=t.k;dish.tag_label=t.l;markDirty();};
    ts.appendChild(s);
  });
  tf.appendChild(ts);div.appendChild(tf);
  return div;
}

function field(label,val,onInput){
  var d=document.createElement('div');d.className='field';
  var l=document.createElement('label');l.textContent=label;
  var i=document.createElement('input');i.type='text';i.value=val;i.className='inline-input';
  i.addEventListener('input',function(){onInput(this.value);});
  d.appendChild(l);d.appendChild(i);return d;
}

// ── EVENTS ──────────────────────────────────────────────────────────
function renderEvents(){
  var el=document.getElementById('tab-events');el.innerHTML='';
  EVENT_KEYS.forEach(function(key){
    var ev=data.events&&data.events[key];if(!ev)return;
    el.appendChild(buildEventCard(key,ev));
  });
}

function buildEventCard(key,ev){
  var wrap=document.createElement('div');wrap.className='section';
  var hd=document.createElement('div');hd.className='section-head';hd.textContent=ev.title||key;
  wrap.appendChild(hd);
  var card=document.createElement('div');card.className='card';

  // top fields row
  var r1=document.createElement('div');r1.className='row2';r1.style.marginBottom='.6rem';
  r1.appendChild(field('Event Title',ev.title||'',function(v){ev.title=v;hd.textContent=v;markDirty();}));
  r1.appendChild(field('Subtitle',ev.subtitle||'',function(v){ev.subtitle=v;markDirty();}));
  card.appendChild(r1);

  var r2=document.createElement('div');r2.className='row2';r2.style.marginBottom='.8rem';
  r2.appendChild(field('Order By Date',ev.order_by||'',function(v){ev.order_by=v;markDirty();}));
  var trow=document.createElement('div');trow.className='field';
  var tl=document.createElement('label');tl.textContent='Show on site';
  var tr=document.createElement('div');tr.className='toggle-row';
  tr.innerHTML='<label class="toggle"><input type="checkbox"'+(ev.active?' checked':'')+'><span class="slider"></span></label><span style="font-size:.83rem;font-weight:600">Active</span>';
  tr.querySelector('input').addEventListener('change',function(){ev.active=this.checked;markDirty();});
  trow.appendChild(tl);trow.appendChild(tr);r2.appendChild(trow);
  card.appendChild(r2);

  // sections
  var shd=document.createElement('div');shd.className='section-head';shd.textContent='Menu Sections';
  card.appendChild(shd);
  var sbox=document.createElement('div');sbox.id='esec-'+key;
  if(!ev.sections)ev.sections=[];
  ev.sections.forEach(function(sec,si){sbox.appendChild(buildEvSection(key,ev,si,sec,sbox));});
  card.appendChild(sbox);
  var ab=document.createElement('button');ab.className='add-btn';ab.style.marginTop='.4rem';ab.textContent='+ Add Section';
  ab.onclick=function(){var si=ev.sections.length;ev.sections.push({name:'New Section',style:'green',dishes:[]});
    sbox.insertBefore(buildEvSection(key,ev,si,ev.sections[si],sbox),ab);markDirty();};
  card.appendChild(ab);
  wrap.appendChild(card);return wrap;
}

function buildEvSection(key,ev,si,sec,sbox){
  var wrap=document.createElement('div');wrap.className='ev-sec-card';
  var head=document.createElement('div');head.className='ev-sec-head';
  var ni=document.createElement('input');ni.type='text';ni.value=sec.name||'';
  ni.placeholder='Section name (e.g. Appetizer)';
  ni.style.cssText='background:transparent;border:none;font-weight:700;font-size:.9rem;color:var(--olive-dk);flex:1;outline:none;min-width:0;font-family:inherit';
  ni.addEventListener('input',function(){sec.name=this.value;markDirty();});
  var acts=document.createElement('div');acts.style.cssText='display:flex;gap:.4rem;align-items:center;flex-shrink:0';
  var ss=document.createElement('select');ss.style.cssText='font-size:.73rem;padding:.15rem .35rem;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg)';
  SECTION_STYLES.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;if(sec.style===s)o.selected=true;ss.appendChild(o);});
  ss.addEventListener('change',function(){sec.style=this.value;markDirty();});
  var rmb=document.createElement('button');rmb.className='btn btn-ghost btn-sm';rmb.textContent='✕';
  rmb.onclick=function(){ev.sections.splice(si,1);renderEvents();markDirty();};
  acts.appendChild(ss);acts.appendChild(rmb);
  head.appendChild(ni);head.appendChild(acts);wrap.appendChild(head);

  var body=document.createElement('div');body.className='ev-sec-body';
  var dbox=document.createElement('div');dbox.id='edish-'+key+'-'+si;
  (sec.dishes||[]).forEach(function(d,di){dbox.appendChild(buildEvDish(sec,di,d,key,si,dbox));});
  body.appendChild(dbox);
  var ab=document.createElement('button');ab.className='add-btn';ab.style.marginTop='.4rem';ab.textContent='+ Add Dish';
  ab.onclick=function(){var di=sec.dishes.length;
    sec.dishes.push({icon:'',name:'',desc:'',prices:[{label:'',amount:''}]});
    dbox.insertBefore(buildEvDish(sec,di,sec.dishes[di],key,si,dbox),ab);markDirty();};
  body.appendChild(ab);
  wrap.appendChild(body);return wrap;
}

function buildEvDish(sec,di,dish,key,si,dbox){
  var wrap=document.createElement('div');wrap.className='dish-card';wrap.style.marginBottom='.5rem';
  var head=document.createElement('div');head.className='dish-head';
  var emjI=document.createElement('input');emjI.type='text';emjI.value=dish.icon||'';emjI.placeholder='emoji';
  emjI.style.cssText='width:3rem;text-align:center;background:var(--card);border:1.5px solid var(--border);border-radius:7px;padding:.3rem;font-size:1rem;outline:none;flex-shrink:0;font-family:inherit';
  emjI.addEventListener('input',function(){dish.icon=this.value;markDirty();});
  var nmI=document.createElement('input');nmI.type='text';nmI.value=dish.name||'';nmI.placeholder='Dish name';
  nmI.className='inline-input';nmI.style.flex='1';nmI.style.margin='0 .4rem';
  nmI.addEventListener('input',function(){dish.name=this.value;markDirty();});
  var rmb=document.createElement('button');rmb.className='btn btn-ghost btn-sm';rmb.textContent='✕';
  rmb.onclick=function(){sec.dishes.splice(di,1);renderEvents();markDirty();};
  head.appendChild(emjI);head.appendChild(nmI);head.appendChild(rmb);wrap.appendChild(head);

  var descF=document.createElement('div');descF.className='field';descF.style.marginBottom='.5rem';
  var di2=document.createElement('input');di2.type='text';di2.value=dish.desc||'';di2.placeholder='Short note (optional)';
  di2.className='inline-input';
  di2.addEventListener('input',function(){dish.desc=this.value;markDirty();});
  descF.appendChild(di2);wrap.appendChild(descF);

  var phd=document.createElement('div');phd.className='section-head';phd.style.cssText='font-size:.68rem;margin-bottom:.3rem';phd.textContent='Prices';
  wrap.appendChild(phd);
  var pbox=document.createElement('div');
  if(!dish.prices||!dish.prices.length)dish.prices=[{label:'',amount:''}];
  dish.prices.forEach(function(p,pi){pbox.appendChild(buildPriceRow(dish,pi,p,pbox));});
  wrap.appendChild(pbox);
  var pab=document.createElement('button');pab.className='add-btn';pab.style.cssText='margin-top:.3rem;font-size:.74rem';pab.textContent='+ Add Tier';
  pab.onclick=function(){dish.prices.push({label:'',amount:''});
    pbox.insertBefore(buildPriceRow(dish,dish.prices.length-1,dish.prices[dish.prices.length-1],pbox),pab);markDirty();};
  wrap.appendChild(pab);
  return wrap;
}

function buildPriceRow(dish,pi,p,pbox){
  var row=document.createElement('div');row.className='price-row';
  var l1=document.createElement('span');l1.className='price-lbl';l1.textContent='Label';
  var i1=document.createElement('input');i1.type='text';i1.value=p.label||'';i1.placeholder='Half / 50 pcs';
  i1.addEventListener('input',function(){p.label=this.value;markDirty();});
  var l2=document.createElement('span');l2.className='price-lbl';l2.textContent='Price';
  var i2=document.createElement('input');i2.type='text';i2.value=p.amount||'';i2.placeholder='$75';
  i2.addEventListener('input',function(){p.amount=this.value;markDirty();});
  var rm=document.createElement('button');rm.className='btn btn-ghost btn-sm';rm.textContent='✕';
  rm.onclick=function(){dish.prices.splice(pi,1);if(!dish.prices.length)dish.prices.push({label:'',amount:''});
    row.remove();markDirty();};
  row.appendChild(l1);row.appendChild(i1);row.appendChild(l2);row.appendChild(i2);row.appendChild(rm);
  return row;
}

// ── SETTINGS ────────────────────────────────────────────────────────
function renderSettings(){
  var el=document.getElementById('tab-settings');el.innerHTML='';
  var s=data.settings||{};
  var sections=[
    {title:'Business Info',fields:[
      {label:'Business Name',key:'business_name'},{label:'Tagline',key:'tagline'},
      {label:'Location',key:'location'},{label:'Tiffin Days',key:'tiffin_days'},
      {label:'Order Cutoff',key:'order_cutoff'}]},
    {title:'Contact',fields:[
      {label:'Phone (display)',key:'phone'},{label:'WhatsApp Number',key:'phone_whatsapp'},
      {label:'Email',key:'email'}]},
    {title:'Payment',fields:[
      {label:'Zelle',key:'payment_zelle'},{label:'Venmo',key:'payment_venmo'}]}
  ];
  sections.forEach(function(sec){
    var wrap=document.createElement('div');wrap.className='section';
    var hd=document.createElement('div');hd.className='section-head';hd.textContent=sec.title;
    var card=document.createElement('div');card.className='card';
    var grid=document.createElement('div');grid.className='row2';
    sec.fields.forEach(function(f){
      var d=document.createElement('div');d.className='field';
      var l=document.createElement('label');l.textContent=f.label;
      var i=document.createElement('input');i.type='text';i.value=s[f.key]||'';i.className='inline-input';
      (function(key){i.addEventListener('input',function(){if(!data.settings)data.settings={};data.settings[key]=this.value;markDirty();});})(f.key);
      d.appendChild(l);d.appendChild(i);grid.appendChild(d);
    });
    card.appendChild(grid);wrap.appendChild(hd);wrap.appendChild(card);el.appendChild(wrap);
  });
  // allergy note full-width
  var aw=document.createElement('div');aw.className='section';
  var ahd=document.createElement('div');ahd.className='section-head';ahd.textContent='Allergy Notice';
  var ac=document.createElement('div');ac.className='card';
  var afield=document.createElement('div');afield.className='field';
  var ata=document.createElement('textarea');ata.textContent=s.allergy_note||'';
  ata.addEventListener('input',function(){if(!data.settings)data.settings={};data.settings.allergy_note=this.value;markDirty();});
  afield.appendChild(ata);ac.appendChild(afield);aw.appendChild(ahd);aw.appendChild(ac);el.appendChild(aw);
}

// ── HELPERS ──────────────────────────────────────────────────────────
function setPath(path,val){
  var parts=path.split('.');var obj=data;
  for(var i=0;i<parts.length-1;i++){if(!obj[parts[i]])obj[parts[i]]={};obj=obj[parts[i]];}
  obj[parts[parts.length-1]]=val;markDirty();
}
function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var dirtyTimer=null;
function markDirty(){clearTimeout(dirtyTimer);setStatus('Unsaved changes — click Save menu.json when ready','');}
function setStatus(msg,type){var el=document.getElementById('status-msg');el.textContent=msg;el.className='status-msg'+(type?' '+type:'');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}

function loadFromFile(){document.getElementById('file-input').click();}
function onFileChosen(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{data=JSON.parse(ev.target.result);render();setStatus('Loaded · '+file.name,'ok');showToast('✓ Loaded '+file.name);}
    catch(err){setStatus('Error: invalid JSON','err');showToast('❌ Could not parse JSON');}
  };
  reader.readAsText(file);e.target.value='';
}

function downloadJSON(){
  if(!data){showToast('Load a menu.json first');return;}
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='menu.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  setStatus('Saved · replace data/menu.json in your repo, then git push','ok');
  showToast('✓ menu.json downloaded');
}
</script>
