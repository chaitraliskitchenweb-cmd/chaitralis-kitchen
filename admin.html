<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaitrali's Kitchen – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root {
  --olive: #6b820d; --olive-d: #556809; --navy: #1A2B4A; --gold: #D4A24C;
  --bg: #f7f5f0; --card: #ffffff; --border: #e2ddd4; --text: #2c2c2c;
  --muted: #6b6560; --red: #c0392b; --tag-bg: #eef2e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ── LOGIN ── */
#login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:var(--card); border-radius:16px; padding:40px 36px; width:360px; box-shadow:0 4px 24px rgba(0,0,0,.12); text-align:center; }
.login-box h1 { color:var(--navy); font-size:1.4rem; margin-bottom:4px; }
.login-box p { color:var(--muted); font-size:.85rem; margin-bottom:24px; }
.login-box input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:.95rem; margin-bottom:12px; outline:none; }
.login-box input:focus { border-color:var(--olive); }
.login-box button { width:100%; padding:11px; background:var(--olive); color:#fff; border:none; border-radius:8px; font-family:inherit; font-size:1rem; font-weight:600; cursor:pointer; }
.login-box button:hover { background:var(--olive-d); }
#login-err { color:var(--red); font-size:.8rem; margin-top:8px; min-height:18px; }

/* ── TOPBAR ── */
#app { display:none; }
.topbar { background:var(--navy); color:#fff; padding:0 20px; display:flex; align-items:center; gap:12px; height:56px; position:sticky; top:0; z-index:100; }
.topbar .brand { font-weight:700; font-size:1rem; flex:1; }
.topbar .brand span { color:var(--gold); }
.btn { padding:8px 16px; border-radius:8px; border:none; font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; }
.btn-olive { background:var(--olive); color:#fff; }
.btn-olive:hover { background:var(--olive-d); }
.btn-gold { background:var(--gold); color:var(--navy); }
.btn-gold:hover { background:#c4912a; }
.btn-ghost { background:transparent; color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.3); }
.btn-ghost:hover { color:#fff; border-color:#fff; }

/* ── MAIN TABS ── */
.main-tabs { display:flex; gap:0; border-bottom:2px solid var(--border); background:var(--card); padding:0 20px; }
.main-tab { padding:14px 20px; font-weight:600; font-size:.9rem; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
.main-tab.active { color:var(--olive); border-bottom-color:var(--olive); }

.tab-content { display:none; padding:24px 20px; max-width:980px; margin:0 auto; }
.tab-content.active { display:block; }

/* ── WEEK TABS ── */
.week-tabs { display:flex; gap:8px; margin-bottom:20px; }
.week-tab { padding:8px 18px; border-radius:20px; font-size:.85rem; font-weight:600; background:var(--border); color:var(--muted); cursor:pointer; border:none; font-family:inherit; }
.week-tab.active { background:var(--olive); color:#fff; }

/* ── CARDS ── */
.card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:20px; margin-bottom:16px; }
.card-title { font-size:.95rem; font-weight:700; color:var(--navy); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.field-row { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.field-row label { font-size:.8rem; font-weight:600; color:var(--muted); min-width:90px; }
.field-row input, .field-row select, .field-row textarea { flex:1; padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:.9rem; outline:none; min-width:160px; }
.field-row input:focus, .field-row select:focus, .field-row textarea:focus { border-color:var(--olive); }
textarea { resize:vertical; min-height:60px; }

/* ── DISH LIST ── */
.dish-list { display:flex; flex-direction:column; gap:8px; }
.dish-item { display:grid; grid-template-columns:1fr 1fr 140px 32px; gap:8px; align-items:center; background:var(--tag-bg); border-radius:8px; padding:10px 12px; }
.dish-item input, .dish-item select { border:1.5px solid var(--border); border-radius:6px; padding:6px 10px; font-family:inherit; font-size:.85rem; outline:none; width:100%; }
.dish-item input:focus, .dish-item select:focus { border-color:var(--olive); }
.dish-item .rm-btn { background:none; border:none; color:var(--red); font-size:1.1rem; cursor:pointer; padding:4px; border-radius:4px; }
.dish-item .rm-btn:hover { background:#fdecea; }
.add-dish-btn { margin-top:10px; padding:8px 16px; border:2px dashed var(--olive); background:none; color:var(--olive); border-radius:8px; font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; width:100%; }
.add-dish-btn:hover { background:var(--tag-bg); }
.dish-header { display:grid; grid-template-columns:1fr 1fr 140px 32px; gap:8px; font-size:.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:0 12px; margin-bottom:2px; }

/* ── EVENT SECTION ── */
.event-meta-card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:16px 20px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
.event-meta-card label { font-size:.8rem; font-weight:600; color:var(--muted); }
.event-meta-card input { padding:7px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:.9rem; outline:none; }
.event-meta-card input:focus { border-color:var(--olive); }
.active-toggle { display:flex; align-items:center; gap:8px; }
.active-toggle input[type=checkbox] { width:18px; height:18px; accent-color:var(--olive); cursor:pointer; }

.section-block { background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden; }
.section-head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#f0ede8; cursor:pointer; user-select:none; }
.section-head .chevron { font-size:.9rem; transition:transform .2s; }
.section-head.open .chevron { transform:rotate(180deg); }
.section-head input.sec-name { flex:1; border:none; background:transparent; font-family:inherit; font-size:.9rem; font-weight:600; outline:none; color:var(--navy); }
.section-head select.sec-style { padding:4px 8px; border:1.5px solid var(--border); border-radius:6px; font-family:inherit; font-size:.8rem; background:var(--card); outline:none; }
.section-head .rm-sec { background:none; border:none; color:var(--red); font-size:1rem; cursor:pointer; padding:4px 6px; border-radius:4px; }
.section-head .rm-sec:hover { background:#fdecea; }
.section-body { display:none; padding:14px 16px; border-top:1px solid var(--border); }
.section-body.open { display:block; }

/* Event dish rows */
.ev-dish-item { background:var(--tag-bg); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
.ev-dish-top { display:grid; grid-template-columns:52px 1fr 1fr 32px; gap:8px; align-items:center; margin-bottom:6px; }
.ev-dish-top input { border:1.5px solid var(--border); border-radius:6px; padding:6px 10px; font-family:inherit; font-size:.85rem; outline:none; width:100%; }
.ev-dish-top input:focus { border-color:var(--olive); }
.ev-dish-prices { display:flex; flex-direction:column; gap:4px; margin-left:60px; }
.price-row { display:grid; grid-template-columns:1fr 1fr 28px; gap:6px; align-items:center; }
.price-row input { border:1.5px solid var(--border); border-radius:6px; padding:5px 10px; font-family:inherit; font-size:.82rem; outline:none; width:100%; }
.price-row input:focus { border-color:var(--gold); }
.price-row .rm-price { background:none; border:none; color:#aaa; font-size:.9rem; cursor:pointer; }
.price-row .rm-price:hover { color:var(--red); }
.add-price-btn { background:none; border:1px dashed var(--gold); color:var(--gold); border-radius:6px; padding:4px 10px; font-family:inherit; font-size:.78rem; font-weight:600; cursor:pointer; margin-top:4px; }
.add-price-btn:hover { background:#fdf8ee; }
.add-ev-dish-btn { margin-top:10px; padding:7px 14px; border:2px dashed var(--olive); background:none; color:var(--olive); border-radius:8px; font-family:inherit; font-size:.82rem; font-weight:600; cursor:pointer; width:100%; }
.add-ev-dish-btn:hover { background:var(--tag-bg); }

.add-section-btn { display:block; width:100%; padding:10px; border:2px dashed var(--gold); background:none; color:var(--gold); border-radius:10px; font-family:inherit; font-size:.88rem; font-weight:600; cursor:pointer; margin-top:4px; }
.add-section-btn:hover { background:#fdf8ee; }

/* ── SETTINGS ── */
.settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.settings-field { display:flex; flex-direction:column; gap:5px; }
.settings-field label { font-size:.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.settings-field input, .settings-field textarea { padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:.9rem; outline:none; }
.settings-field input:focus, .settings-field textarea:focus { border-color:var(--olive); }
.settings-field.full { grid-column:1/-1; }

/* ── TOAST ── */
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--navy); color:#fff; padding:10px 22px; border-radius:24px; font-size:.88rem; font-weight:600; opacity:0; transition:all .3s; pointer-events:none; z-index:999; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

@media(max-width:640px){
  .dish-item { grid-template-columns:1fr 1fr; }
  .dish-item select { grid-column:1; } .dish-item .rm-btn { grid-column:2; justify-self:end; }
  .dish-header { display:none; }
  .settings-grid { grid-template-columns:1fr; }
  .ev-dish-top { grid-template-columns:44px 1fr 32px; }
  .ev-dish-top input:nth-child(3) { grid-column:1/-1; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🌿 Chaitrali's Kitchen</h1>
    <p>Menu Admin · Sign in to continue</p>
    <input type="password" id="pwd-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Sign In</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand">🌿 <span>Chaitrali's</span> Kitchen Admin</div>
    <button class="btn btn-olive" onclick="saveDraft()">💾 Save Draft</button>
    <button class="btn btn-gold" onclick="downloadJson()">⬇ Download menu.json</button>
    <button class="btn btn-ghost" onclick="signOut()">Sign Out</button>
  </div>

  <div class="main-tabs">
    <div class="main-tab active" onclick="switchMain('tiffin',this)">📅 Weekly Tiffin</div>
    <div class="main-tab" onclick="switchMain('events',this)">🎉 Events &amp; Seasonal</div>
    <div class="main-tab" onclick="switchMain('settings',this)">⚙️ Settings</div>
  </div>

  <!-- ══ TIFFIN TAB ══ -->
  <div id="tab-tiffin" class="tab-content active">
    <div class="week-tabs">
      <button class="week-tab active" onclick="switchWeek('last_week',this)">⬅ Last Week</button>
      <button class="week-tab" onclick="switchWeek('this_week',this)">This Week ✨</button>
      <button class="week-tab" onclick="switchWeek('next_week',this)">Next Week ➡</button>
    </div>
    <div id="week-last_week" class="week-panel">
      <div class="card">
        <div class="card-title">Last Week</div>
        <div class="field-row"><label>Dates</label><input type="text" id="lw-dates" placeholder="e.g. Oct 1 – Oct 6, 2026"></div>
        <div class="dish-header"><span>Dish Name</span><span>Description</span><span>Category</span><span></span></div>
        <div class="dish-list" id="dishes-last_week"></div>
        <button class="add-dish-btn" onclick="addDish('last_week')">+ Add Dish</button>
      </div>
    </div>
    <div id="week-this_week" class="week-panel" style="display:none">
      <div class="card">
        <div class="card-title">This Week</div>
        <div class="field-row"><label>Dates</label><input type="text" id="tw-dates" placeholder="e.g. Oct 7 – Oct 12, 2026"></div>
        <div class="dish-header"><span>Dish Name</span><span>Description</span><span>Category</span><span></span></div>
        <div class="dish-list" id="dishes-this_week"></div>
        <button class="add-dish-btn" onclick="addDish('this_week')">+ Add Dish</button>
      </div>
    </div>
    <div id="week-next_week" class="week-panel" style="display:none">
      <div class="card">
        <div class="card-title">Next Week</div>
        <div class="field-row"><label>Dates</label><input type="text" id="nw-dates" placeholder="e.g. Oct 14 – Oct 19, 2026"></div>
        <div class="dish-header"><span>Dish Name</span><span>Description</span><span>Category</span><span></span></div>
        <div class="dish-list" id="dishes-next_week"></div>
        <button class="add-dish-btn" onclick="addDish('next_week')">+ Add Dish</button>
      </div>
    </div>
  </div>

  <!-- ══ EVENTS TAB ══ -->
  <div id="tab-events" class="tab-content">
    <div class="week-tabs">
      <button class="week-tab active" onclick="switchEvent('ganpati',this)">🐘 Ganpati</button>
      <button class="week-tab" onclick="switchEvent('diwali',this)">🪔 Diwali</button>
      <button class="week-tab" onclick="switchEvent('holi',this)">🌸 Holi</button>
      <button class="week-tab" onclick="switchEvent('custom',this)">🎉 Custom</button>
    </div>
    <div id="ev-ganpati" class="ev-panel"></div>
    <div id="ev-diwali" class="ev-panel" style="display:none"></div>
    <div id="ev-holi" class="ev-panel" style="display:none"></div>
    <div id="ev-custom" class="ev-panel" style="display:none"></div>
  </div>

  <!-- ══ SETTINGS TAB ══ -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <div class="card-title">Business Settings</div>
      <div class="settings-grid">
        <div class="settings-field"><label>Business Name</label><input type="text" id="s-business_name"></div>
        <div class="settings-field"><label>Tagline</label><input type="text" id="s-tagline"></div>
        <div class="settings-field"><label>Phone</label><input type="text" id="s-phone"></div>
        <div class="settings-field"><label>WhatsApp Number</label><input type="text" id="s-phone_whatsapp" placeholder="16173205229"></div>
        <div class="settings-field"><label>Email</label><input type="text" id="s-email"></div>
        <div class="settings-field"><label>Location</label><input type="text" id="s-location"></div>
        <div class="settings-field"><label>Tiffin Days</label><input type="text" id="s-tiffin_days" placeholder="Mon – Sat"></div>
        <div class="settings-field"><label>Order Cutoff</label><input type="text" id="s-order_cutoff" placeholder="Sunday 9 PM"></div>
        <div class="settings-field"><label>Zelle (payment)</label><input type="text" id="s-payment_zelle"></div>
        <div class="settings-field"><label>Venmo (payment)</label><input type="text" id="s-payment_venmo"></div>
        <div class="settings-field full"><label>Allergy Note</label><textarea id="s-allergy_note" rows="3"></textarea></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const PASSWORD = 'chaitrali2024';
const STORAGE_KEY = 'ck_admin_draft_v3';

const TAG_OPTIONS = [
  {val:'gravy',label:'Gravy'},{val:'rassa',label:'Rassa'},{val:'dry',label:'Dry Sabzi'},
  {val:'dal',label:'Dal'},{val:'usal',label:'Usal'},{val:'spicy',label:'Spicy · Gravy'},
  {val:'rice',label:'Rice'},{val:'special',label:'Festival Special'},{val:'snack',label:'Snack'}
];
const TAG_LABELS = Object.fromEntries(TAG_OPTIONS.map(t=>[t.val,t.label]));

const EVENTS_CONFIG = {
  ganpati: {emoji:'🐘', title:'Ganpati'},
  diwali:  {emoji:'🪔', title:'Diwali'},
  holi:    {emoji:'🌸', title:'Holi'},
  custom:  {emoji:'🎉', title:'Custom Event'}
};

let menu = null;

// ── AUTH ──
function doLogin(){
  const v = document.getElementById('pwd-input').value;
  const err = document.getElementById('login-err');
  if(v === PASSWORD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadMenu();
  } else {
    err.textContent = 'Incorrect password. Try again.';
    setTimeout(()=>err.textContent='',3000);
  }
}
function signOut(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-input').value='';
}

// ── TAB SWITCHING ──
function switchMain(id, el){
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}
function switchWeek(wk, el){
  document.querySelectorAll('#tab-tiffin .week-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.week-panel').forEach(p=>p.style.display='none');
  el.classList.add('active');
  document.getElementById('week-'+wk).style.display='block';
}
function switchEvent(ek, el){
  document.querySelectorAll('#tab-events .week-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.ev-panel').forEach(p=>p.style.display='none');
  el.classList.add('active');
  document.getElementById('ev-'+ek).style.display='block';
}

// ── TIFFIN ──
function makeDishItem(d){
  const opts = TAG_OPTIONS.map(o=>`<option value="${o.val}"${d&&d.tag===o.val?' selected':''}>${o.label}</option>`).join('');
  const el = document.createElement('div');
  el.className='dish-item';
  el.innerHTML=`
    <input type="text" class="d-name" placeholder="Dish name" value="${escA(d?.name||'')}">
    <input type="text" class="d-desc" placeholder="Description (Marathi/English)" value="${escA(d?.desc||'')}">
    <select class="d-tag">${opts}</select>
    <button class="rm-btn" onclick="removeDish(this)" title="Remove">✕</button>`;
  return el;
}
function addDish(wk){ document.getElementById('dishes-'+wk).appendChild(makeDishItem(null)); }
function removeDish(btn){ btn.closest('.dish-item').remove(); }

function loadTiffinWeek(wk, data){
  const prefixMap = {last_week:'lw',this_week:'tw',next_week:'nw'};
  const pre = prefixMap[wk];
  document.getElementById(pre+'-dates').value = data.dates||'';
  const list = document.getElementById('dishes-'+wk);
  list.innerHTML='';
  (data.dishes||[]).forEach(d=>list.appendChild(makeDishItem(d)));
}

function collectTiffinWeek(wk){
  const prefixMap = {last_week:'lw',this_week:'tw',next_week:'nw'};
  const pre = prefixMap[wk];
  const dates = document.getElementById(pre+'-dates').value;
  const dishes = [...document.querySelectorAll('#dishes-'+wk+' .dish-item')].map(el=>({
    name: el.querySelector('.d-name').value.trim(),
    desc: el.querySelector('.d-desc').value.trim(),
    tag:  el.querySelector('.d-tag').value,
    tag_label: TAG_LABELS[el.querySelector('.d-tag').value]||''
  }));
  return {dates, dishes};
}

// ── EVENTS ──
function buildEventPanel(ek, ev){
  const cfg = EVENTS_CONFIG[ek];
  const panel = document.getElementById('ev-'+ek);
  panel.innerHTML='';

  // Meta card
  const meta = document.createElement('div');
  meta.className='event-meta-card';
  meta.innerHTML=`
    <div style="font-weight:700;font-size:1rem;color:var(--navy)">${cfg.emoji} ${ev.title||cfg.title}</div>
    <div style="flex:1"></div>
    <label>Order By:</label>
    <input type="text" class="ev-order_by" placeholder="e.g. 10 September" value="${escA(ev.order_by||'')}">
    <div class="active-toggle">
      <input type="checkbox" class="ev-active" id="active-${ek}" ${ev.active?'checked':''}>
      <label for="active-${ek}" style="cursor:pointer;font-weight:600;color:var(--olive)">Active / Visible</label>
    </div>`;
  panel.appendChild(meta);

  // Sections
  const sectionsWrap = document.createElement('div');
  sectionsWrap.className='ev-sections';
  panel.appendChild(sectionsWrap);
  (ev.sections||[]).forEach((sec,si)=>sectionsWrap.appendChild(makeSection(ek,si,sec)));

  const addBtn = document.createElement('button');
  addBtn.className='add-section-btn';
  addBtn.textContent='+ Add Menu Section';
  addBtn.onclick=()=>{ sectionsWrap.appendChild(makeSection(ek,sectionsWrap.children.length,null)); addBtn.remove(); sectionsWrap.closest('.ev-panel').querySelector('.add-section-btn')||panel.appendChild(addBtn); };
  // re-add after sections
  panel.appendChild(addBtn);
}

function makeSection(ek, si, sec){
  const block = document.createElement('div');
  block.className='section-block';
  const styleOpts = ['green','maroon','gold'].map(s=>`<option value="${s}"${sec&&sec.style===s?' selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
  const head = document.createElement('div');
  head.className='section-head open';
  head.innerHTML=`
    <span class="chevron">▲</span>
    <input class="sec-name" type="text" placeholder="Section name" value="${escA(sec?.name||'')}">
    <select class="sec-style">${styleOpts}</select>
    <button class="rm-sec" onclick="removeSection(this)" title="Remove section">✕</button>`;
  head.querySelector('.sec-name').addEventListener('click',e=>e.stopPropagation());
  head.querySelector('.sec-style').addEventListener('click',e=>e.stopPropagation());
  head.querySelector('.rm-sec').addEventListener('click',e=>e.stopPropagation());
  head.addEventListener('click',()=>toggleSection(head));
  block.appendChild(head);

  const body = document.createElement('div');
  body.className='section-body open';
  const dishList = document.createElement('div');
  dishList.className='ev-dish-list';
  (sec?.dishes||[]).forEach(d=>dishList.appendChild(makeEvDish(d)));
  body.appendChild(dishList);
  const addDishBtn = document.createElement('button');
  addDishBtn.className='add-ev-dish-btn';
  addDishBtn.textContent='+ Add Dish';
  addDishBtn.onclick=()=>dishList.appendChild(makeEvDish(null));
  body.appendChild(addDishBtn);
  block.appendChild(body);
  return block;
}

function makeEvDish(d){
  const item = document.createElement('div');
  item.className='ev-dish-item';
  const top = document.createElement('div');
  top.className='ev-dish-top';
  top.innerHTML=`
    <input type="text" class="d-icon" placeholder="🍛" value="${escA(d?.icon||'')}">
    <input type="text" class="d-name" placeholder="Dish name" value="${escA(d?.name||'')}">
    <input type="text" class="d-desc" placeholder="Description / note" value="${escA(d?.desc||'')}">
    <button class="rm-btn" onclick="removeEvDish(this)" title="Remove">✕</button>`;
  item.appendChild(top);

  const pricesDiv = document.createElement('div');
  pricesDiv.className='ev-dish-prices';
  (d?.prices||[]).forEach(p=>pricesDiv.appendChild(makePriceRow(p)));
  const addP = document.createElement('button');
  addP.className='add-price-btn';
  addP.textContent='+ Add Price';
  addP.onclick=()=>pricesDiv.insertBefore(makePriceRow(null),addP);
  pricesDiv.appendChild(addP);
  item.appendChild(pricesDiv);
  return item;
}

function makePriceRow(p){
  const row = document.createElement('div');
  row.className='price-row';
  row.innerHTML=`
    <input type="text" class="p-label" placeholder='Label (e.g. "Half")' value="${escA(p?.label||'')}">
    <input type="text" class="p-amount" placeholder='Amount (e.g. "$80")' value="${escA(p?.amount||'')}">
    <button class="rm-price" onclick="this.closest('.price-row').remove()" title="Remove">✕</button>`;
  return row;
}

function removeSection(btn){ btn.closest('.section-block').remove(); }
function removeEvDish(btn){ btn.closest('.ev-dish-item').remove(); }
function toggleSection(head){
  head.classList.toggle('open');
  head.nextElementSibling.classList.toggle('open');
}

function collectEventPanel(ek){
  const panel = document.getElementById('ev-'+ek);
  const orderBy = panel.querySelector('.ev-order_by')?.value.trim()||'';
  const active = panel.querySelector('.ev-active')?.checked||false;
  const sections = [...panel.querySelectorAll('.section-block')].map(blk=>({
    name: blk.querySelector('.sec-name').value.trim(),
    style: blk.querySelector('.sec-style').value,
    dishes: [...blk.querySelectorAll('.ev-dish-item')].map(el=>({
      icon: el.querySelector('.d-icon').value.trim(),
      name: el.querySelector('.d-name').value.trim(),
      desc: el.querySelector('.d-desc').value.trim(),
      prices: [...el.querySelectorAll('.price-row')].map(r=>({
        label: r.querySelector('.p-label').value.trim(),
        amount: r.querySelector('.p-amount').value.trim()
      })).filter(p=>p.amount)
    })).filter(d=>d.name)
  }));
  return {
    title: EVENTS_CONFIG[ek].title,
    subtitle: menu.events[ek]?.subtitle||'',
    order_by: orderBy,
    active,
    sections
  };
}

// ── SETTINGS ──
const SETTING_KEYS=['business_name','tagline','phone','phone_whatsapp','email','location','tiffin_days','order_cutoff','payment_zelle','payment_venmo','allergy_note'];
function loadSettings(s){ SETTING_KEYS.forEach(k=>{ const el=document.getElementById('s-'+k); if(el) el.value=s[k]||''; }); }
function collectSettings(){ const s={}; SETTING_KEYS.forEach(k=>{ const el=document.getElementById('s-'+k); if(el) s[k]=el.value.trim(); }); return s; }

// ── COLLECT ALL ──
function collectMenu(){
  return {
    settings: collectSettings(),
    tiffin: {
      last_week: collectTiffinWeek('last_week'),
      this_week: collectTiffinWeek('this_week'),
      next_week: collectTiffinWeek('next_week')
    },
    events: Object.fromEntries(Object.keys(EVENTS_CONFIG).map(ek=>[ek, collectEventPanel(ek)]))
  };
}

// ── LOAD / SAVE ──
function renderMenu(m){
  menu = m;
  ['last_week','this_week','next_week'].forEach(wk=>loadTiffinWeek(wk, m.tiffin[wk]||{}));
  Object.keys(EVENTS_CONFIG).forEach(ek=>buildEventPanel(ek, m.events[ek]||{title:'',subtitle:'',order_by:'',active:false,sections:[]}));
  loadSettings(m.settings||{});
}

async function loadMenu(){
  // 1. Try localStorage draft
  try {
    const draft = localStorage.getItem(STORAGE_KEY);
    if(draft){ renderMenu(JSON.parse(draft)); showToast('Loaded saved draft'); return; }
  } catch(e){}
  // 2. Try fetching menu.json from repo
  try {
    const r = await fetch('../data/menu.json');
    if(r.ok){ renderMenu(await r.json()); showToast('Loaded menu.json'); return; }
  } catch(e){}
  // 3. Empty defaults
  renderMenu(defaultMenu());
  showToast('Starting with empty menu');
}

function defaultMenu(){
  return {
    settings:{ business_name:"Chaitrali's Kitchen", tagline:'Pure Veg · Homemade · Marathi Chavichi Athavan',
      phone:'617-320-5229', phone_whatsapp:'16173205229', email:'chaitraliskitchen@gmail.com',
      location:'Shrewsbury, MA', tiffin_days:'Mon – Sat', order_cutoff:'Sunday 9 PM',
      payment_zelle:'chaitraliskitchen@gmail.com', payment_venmo:'@Chaitralis-Kitchen',
      allergy_note:'Our food is prepared in a home kitchen that handles dairy, gluten (wheat), peanuts, tree nuts, sesame and mustard.' },
    tiffin:{ last_week:{dates:'',dishes:[]}, this_week:{dates:'',dishes:[]}, next_week:{dates:'',dishes:[]} },
    events:{ ganpati:{title:'Ganpati',subtitle:'Special Festival Menu',order_by:'',active:false,sections:[]},
      diwali:{title:'Diwali',subtitle:'Festival of Lights Menu',order_by:'',active:false,sections:[]},
      holi:{title:'Holi',subtitle:'Festival of Colors Menu',order_by:'',active:false,sections:[]},
      custom:{title:'Custom Event',subtitle:'Birthday · Anniversary · Puja · Gathering',order_by:'',active:true,sections:[]} }
  };
}

function saveDraft(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectMenu())); showToast('Draft saved!'); }
  catch(e){ showToast('Could not save draft'); }
}

function downloadJson(){
  const data = collectMenu();
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='menu.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('menu.json downloaded! Replace the file in your GitHub repo and push.');
}

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── UTILS ──
function escA(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
</script>
