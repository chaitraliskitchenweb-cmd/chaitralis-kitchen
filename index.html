<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaitrali's Kitchen — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    color: #fff;
    background: #2C4A2E;
  }

  .bg {
    position: fixed;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=1200&q=80&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-color: #2C4A2E;
    filter: brightness(0.38);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #D4A24C;
    margin-bottom: 28px;
    display: block;
    font-weight: 500;
  }

  .logo-wrap {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px solid rgba(212,162,76,0.5);
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .logo-wrap img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    border-radius: 50%;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  h1 em {
    font-style: italic;
    color: #D4A24C;
  }

  .line {
    width: 48px;
    height: 2px;
    background: #D4A24C;
    margin: 20px auto;
  }

  .sub {
    font-size: 1rem;
    color: rgba(255,255,255,0.72);
    font-weight: 300;
    letter-spacing: 0.03em;
    line-height: 1.7;
  }

  .location {
    font-size: 0.88rem;
    color: rgba(212,162,76,0.8);
    margin-top: 6px;
    letter-spacing: 0.06em;
    font-weight: 400;
  }

  .coming {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: #D4A24C;
    margin-top: 28px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <span class="badge">✦ Homemade &nbsp;·&nbsp; Pure Veg ✦</span>

    <div class="logo-wrap">
      <img src="logo.png" alt="Chaitrali's Kitchen Logo">
    </div>

    <h1>Chaitrali's <em>Kitchen</em></h1>

    <div class="line"></div>

    <p class="sub">Authentic Maharashtrian Home Style Cuisine</p>
    <p class="location">From Shrewsbury · Now Serving</p>

    <p class="coming">Coming Shortly…</p>
  </div>
</body>
</html>
