<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaitrali's Kitchen — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    color: #fff;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: url('https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=1600&q=85&auto=format&fit=crop') center/cover no-repeat;
    filter: brightness(0.45);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 24px;
  }

  .badge {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #D4A24C;
    margin-bottom: 20px;
    display: block;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 7vw, 4rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  h1 em {
    font-style: italic;
    color: #D4A24C;
  }

  .line {
    width: 48px;
    height: 2px;
    background: #D4A24C;
    margin: 20px auto;
  }

  p {
    font-size: 1.05rem;
    color: rgba(255,255,255,0.75);
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  .coming {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: #D4A24C;
    margin-top: 28px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <span class="badge">✦ Homemade · Pure Veg · Marathi ✦</span>
    <h1>Chaitrali's <em>Kitchen</em></h1>
    <div class="line"></div>
    <p>Authentic homemade Marathi cuisine<br>Quincy, MA</p>
    <p class="coming">Coming Shortly…</p>
  </div>
</body>
</html>
